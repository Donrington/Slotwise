services:
  - type: web
    name: slotwise-api
    runtime: node
    rootDir: api
    plan: free
    # One instance only: the per-email rate limiter lives in memory.
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL # pooled (-pooler) Neon URL for app traffic
        sync: false
      - key: DATABASE_URL_UNPOOLED # direct Neon URL, used only for migrations at boot
        sync: false
      - key: API_KEY
        sync: false
      - key: NEON_REALTIME_URL # optional: enables live slot availability on the page
        sync: false
      - key: NEON_REALTIME_SECRET
        sync: false
